name: Infra

on:
  pull_request:
    paths:
      - "infra/terraform/**"
      - ".github/workflows/infra.yml"
  push:
    branches: [dev]
    paths:
      - "infra/terraform/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Terraform fmt e validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: 1.9.8 }
      - name: fmt
        run: terraform fmt -check -recursive infra/terraform
      - name: validate
        run: |
          for dir in infra/terraform/envs/*; do
            (cd "$dir" && terraform init -backend=false -input=false && terraform validate)
          done
